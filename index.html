        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

            currentState.view = 'home';
            renderApp();

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz(variantIndex, isExpress = false) {
            let selectedQ = [];
            if (isExpress) {
                const all = ALL_VARIANTS.map(v => v.questions).flat();
                selectedQ = shuffleArray(all).slice(0, 20);
            } else {
                selectedQ = ALL_VARIANTS[variantIndex].questions;
            }

            const processedQuestions = selectedQ.map(q => {
                const questionText = q[0];
                const choices = q[1];
                const correctIdx = q[2];
                const explanation = q[3];

                const mappedChoices = choices.map((c, idx) => ({ text: c, isCorrect: idx === correctIdx }));
                const shuffledChoices = shuffleArray(mappedChoices);

                return {
                    questionText,
                    choices: shuffledChoices,
                    explanation
                };
            });

            currentState.view = 'quiz';
            currentState.currentVariantIndex = variantIndex;
            currentState.isExpress = isExpress;
            currentState.questions = processedQuestions;
            currentState.currentIndex = 0;
            currentState.userAnswers = [];

            renderApp();
        }

        function handleAnswer(choiceIdx) {
            if (currentState.userAnswers[currentState.currentIndex] !== undefined) return;

            const currentQ = currentState.questions[currentState.currentIndex];
            const isCorrect = currentQ.choices[choiceIdx].isCorrect;
            currentState.userAnswers[currentState.currentIndex] = {
                choiceIndex: choiceIdx,
                isCorrect: isCorrect
            };

            const app = document.getElementById('app');
            if (app) renderQuiz(app);
        }

        function nextQuestion() {
            if (currentState.currentIndex < currentState.questions.length - 1) {
                currentState.currentIndex++;
                const app = document.getElementById('app');
                if (app) renderQuiz(app);
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            const score = currentState.userAnswers.filter(a => a && a.isCorrect).length;
            
            if (!currentState.isExpress) {
                const key = `v_${currentState.currentVariantIndex}`;
                const prev = currentState.stats[key] || { attempts: 0, maxScore: 0 };
                currentState.stats[key] = {
                    attempts: prev.attempts + 1,
                    maxScore: Math.max(prev.maxScore, score),
                    lastScore: score,
                    date: new Date().toLocaleDateString()
                };
                saveStats();
            }

            currentState.view = 'result';
            renderApp();
        }

        function renderApp() {
            const app = document.getElementById('app');
            if (!app) return;
            app.innerHTML = '';

            if (currentState.view === 'home') {
                renderHome(app);
            } else if (currentState.view === 'quiz') {
                renderQuiz(app);
            } else if (currentState.view === 'result') {
                renderResult(app);
            }
        }

                        </div>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-3 sm:p-4 rounded-xl sm:rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center gap-2.5 sm:gap-3">
                        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 flex items-center justify-center font-bold text-sm sm:text-lg flex-shrink-0">
                            <i class="fa-solid fa-star"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="text-[10px] sm:text-xs text-slate-500 dark:text-slate-400 font-medium truncate">Орташа нәтиже</div>
                            <div class="text-sm sm:text-lg font-bold">${totalPassed ? Math.round((totalBestScore / (totalPassed * 20)) * 100) : 0}%</div>
                        </div>
                    </div>
                    <div class="bg-white dark:bg-slate-900 p-3 sm:p-4 rounded-xl sm:rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center gap-2.5 sm:gap-3">
                        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center font-bold text-sm sm:text-lg flex-shrink-0">
                            <i class="fa-solid fa-database"></i>
                        </div>
                        <div class="min-w-0">
                            <div class="text-[10px] sm:text-xs text-slate-500 dark:text-slate-400 font-medium truncate">Барлық сұрақ</div>
                            <div class="text-sm sm:text-lg font-bold">200 Сұрақ</div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between mb-4 sm:mb-6">
                    <h3 class="text-base sm:text-xl font-bold flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-brand-600 dark:text-brand-400"></i> Тест Варианттары
                    </h3>
                    <span class="text-[10px] sm:text-xs font-semibold px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">10 Вариант</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">
                    ${ALL_VARIANTS.map((v, idx) => {
                        const stat = currentState.stats[`v_${idx}`];
                        const isDone = !!stat;
                        const score = stat ? stat.maxScore : 0;
                        const percent = stat ? Math.round((score / 20) * 100) : 0;

                        return `
                            <div onclick="startQuiz(${idx})" class="group bg-white dark:bg-slate-900 rounded-xl sm:rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-slate-800 hover:border-brand-500 dark:hover:border-brand-500 shadow-sm transition-all cursor-pointer relative overflow-hidden flex flex-col justify-between">
                                <div class="flex items-start justify-between mb-2 sm:mb-3">
                                    <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg sm:rounded-xl bg-slate-100 dark:bg-slate-800 group-hover:bg-brand-500 group-hover:text-white transition-colors flex items-center justify-center font-black text-sm sm:text-base text-slate-700 dark:text-slate-300">
                                        ${idx + 1}
                                    </div>
                                    ${isDone ? `
                                        <span class="text-[10px] sm:text-xs font-bold px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-full ${score >= 15 ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400' : 'bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-400'}">
                                            ${score}/20 балл
                                        </span>
                                    ` : `
                                        <span class="text-[10px] sm:text-xs font-medium text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded">Жаңа</span>
                                    `}
                                </div>
                                <div>
                                    <h4 class="font-bold text-sm sm:text-base text-slate-900 dark:text-slate-100 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors mb-1 line-clamp-2">${v.title}</h4>
                                    <p class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 mb-3 sm:mb-4">20 нақты тарихи сұрақ</p>
                                </div>
                                <div>
                                    ${isDone ? `
                                        <div class="w-full bg-slate-100 dark:bg-slate-800 h-1.5 rounded-full overflow-hidden mb-2">
                                            <div class="bg-brand-500 h-full rounded-full" style="width: ${percent}%"></div>
                                        </div>
                                    ` : ''}
                                    <div class="flex items-center justify-between text-xs font-semibold text-brand-600 dark:text-brand-400">
                                        <span>Тестті бастау</span>
                                        <i class="fa-solid fa-arrow-right"></i>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            container.innerHTML = html;
        }

        function renderQuiz(container) {
            const currentQ = currentState.questions[currentState.currentIndex];
            const total = currentState.questions.length;
            const answerState = currentState.userAnswers[currentState.currentIndex];
            const isAnswered = answerState !== undefined;

            const html = `
                <div class="max-w-3xl mx-auto">
                    <div class="flex items-center justify-between mb-4 sm:mb-6 gap-2">
                        <button onclick="goHome()" class="text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center gap-1">
                            <i class="fa-solid fa-chevron-left"></i> Артқа
                        </button>
                        <div class="text-xs sm:text-sm font-bold text-brand-600 dark:text-brand-400 text-center truncate max-w-[160px] sm:max-w-[280px]">
                            ${currentState.isExpress ? 'Экспресс Тест' : ALL_VARIANTS[currentState.currentVariantIndex].title}
                        </div>
                        <div class="text-xs font-bold bg-slate-200 dark:bg-slate-800 px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full flex-shrink-0">
                            ${currentState.currentIndex + 1} / ${total}
                        </div>
                    </div>

                    <div class="w-full bg-slate-200 dark:bg-slate-800 h-1.5 sm:h-2 rounded-full mb-4 sm:mb-6 overflow-hidden">
                        <div class="bg-brand-500 h-full transition-all duration-300" style="width: ${((currentState.currentIndex + 1) / total) * 100}%"></div>
                    </div>

                    <div class="bg-white dark:bg-slate-900 rounded-2xl sm:rounded-3xl p-4 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-md sm:shadow-lg mb-4 sm:mb-6">
                        <h3 class="text-base sm:text-xl font-bold mb-4 sm:mb-6 leading-snug sm:leading-relaxed text-slate-900 dark:text-slate-50">
                            ${currentQ.questionText}
                        </h3>

                        <div class="space-y-2.5 sm:space-y-3">
                            ${currentQ.choices.map((choice, idx) => {
                                let btnStyle = "border-slate-200 dark:border-slate-800 hover:border-brand-500 bg-slate-50/50 dark:bg-slate-800/40 text-slate-800 dark:text-slate-200 active:scale-[0.99]";
                                let badge = `<span class="w-6 h-6 sm:w-8 sm:h-8 rounded-lg sm:rounded-xl bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-xs font-bold mr-2.5 sm:mr-3 flex-shrink-0 pointer-events-none">${String.fromCharCode(65 + idx)}</span>`;

                                if (isAnswered) {
                                    if (choice.isCorrect) {
                                        btnStyle = "border-emerald-500 bg-emerald-50 dark:bg-emerald-950/50 text-emerald-900 dark:text-emerald-200 font-semibold";
                                        badge = `<span class="w-6 h-6 sm:w-8 sm:h-8 rounded-lg sm:rounded-xl bg-emerald-500 text-white flex items-center justify-center text-xs font-bold mr-2.5 sm:mr-3 flex-shrink-0 pointer-events-none"><i class="fa-solid fa-check"></i></span>`;
                                    } else if (answerState.choiceIndex === idx) {
                                        btnStyle = "border-rose-500 bg-rose-50 dark:bg-rose-950/50 text-rose-900 dark:text-rose-200 font-semibold";
                                        badge = `<span class="w-6 h-6 sm:w-8 sm:h-8 rounded-lg sm:rounded-xl bg-rose-500 text-white flex items-center justify-center text-xs font-bold mr-2.5 sm:mr-3 flex-shrink-0 pointer-events-none"><i class="fa-solid fa-xmark"></i></span>`;
                                    } else {
                                        btnStyle = "opacity-50 border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 cursor-not-allowed";
                                    }
                                }

                                return `
                                    <button type="button" onclick="handleAnswer(${idx})" ${isAnswered ? 'disabled' : ''} class="w-full text-left p-3 sm:p-4 rounded-xl sm:rounded-2xl border-2 transition-all flex items-center cursor-pointer select-none ${btnStyle}">
                                        ${badge}
                                        <span class="flex-grow text-xs sm:text-base pointer-events-none leading-tight">${choice.text}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        ${isAnswered ? `
                            <div class="mt-4 sm:mt-6 p-3.5 sm:p-5 rounded-xl sm:rounded-2xl ${answerState.isCorrect ? 'bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/50 text-emerald-950 dark:text-emerald-200' : 'bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800/50 text-rose-950 dark:text-rose-200'}">
                                <div class="flex items-center gap-2 font-bold mb-1 sm:mb-2 text-xs sm:text-sm">
                                    <i class="fa-solid ${answerState.isCorrect ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-rose-600'}"></i>
                                    <span>${answerState.isCorrect ? 'Дұрыс жауап!' : 'Қате жауап!'}</span>
                                </div>
                                <p class="text-xs sm:text-sm leading-relaxed opacity-90">
                                    <strong class="font-semibold">Тарихи факт:</strong> ${currentQ.explanation}
                                </p>
                            </div>
                        ` : ''}
                    </div>

                    <div class="flex justify-end">
                        ${isAnswered ? `
                            <button onclick="nextQuestion()" class="w-full sm:w-auto px-6 py-3 sm:px-8 sm:py-3.5 rounded-xl sm:rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold shadow-lg shadow-brand-600/30 transition-all flex items-center justify-center gap-2 active:scale-95 text-sm sm:text-base">
                                <span>${currentState.currentIndex === total - 1 ? 'Нәтижені Көру' : 'Келесі Сұрақ'}</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        ` : `
                            <div class="text-xs text-slate-400 font-medium self-center">Жауап нұсқасын таңдаңыз</div>
                        `}
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function renderResult(container) {
            const score = currentState.userAnswers.filter(a => a && a.isCorrect).length;
            const total = currentState.questions.length;
            const percent = Math.round((score / total) * 100);
            const wrongAnswers = currentState.questions.map((q, idx) => ({
                question: q,
                answer: currentState.userAnswers[idx]
            })).filter(item => item.answer && !item.answer.isCorrect);

            let resultTitle = "Өте жақсы көрсеткіш!";
            let resultIcon = "fa-trophy text-amber-400";
            if (percent < 50) {
                resultTitle = "Әлі де қайталау қажет!";
                resultIcon = "fa-book-open text-rose-500";
            } else if (percent < 75) {
                resultTitle = "Жақсы нәтиже!";
                resultIcon = "fa-award text-teal-500";
            }

            const html = `
                <div class="max-w-3xl mx-auto">
                    <div class="bg-white dark:bg-slate-900 rounded-2xl sm:rounded-3xl p-5 sm:p-8 border border-slate-200 dark:border-slate-800 shadow-xl text-center mb-6 sm:mb-8">
                        <div class="w-14 h-14 sm:w-20 sm:h-20 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center mx-auto mb-3 sm:mb-4 text-2xl sm:text-4xl">
                            <i class="fa-solid ${resultIcon}"></i>
                        </div>
                        <h2 class="text-xl sm:text-3xl font-extrabold mb-1 sm:mb-2">${resultTitle}</h2>
                        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mb-4 sm:mb-6">
                            ${currentState.isExpress ? 'Экспресс-тест қорытындысы' : ALL_VARIANTS[currentState.currentVariantIndex].title}
                        </p>

                        <div class="inline-flex items-center justify-center p-4 sm:p-6 rounded-xl sm:rounded-2xl bg-slate-50 dark:bg-slate-800/60 mb-6 border border-slate-200/60 dark:border-slate-700/60 w-full sm:w-auto">
                            <div class="text-center px-4 sm:px-6 border-r border-slate-200 dark:border-slate-700">
                                <div class="text-2xl sm:text-4xl font-extrabold text-brand-600 dark:text-brand-400">${score} / ${total}</div>
                                <div class="text-[10px] sm:text-xs text-slate-500 font-semibold uppercase tracking-wider mt-1">Жинаған ұпай</div>
                            </div>
                            <div class="text-center px-4 sm:px-6">
                                <div class="text-2xl sm:text-4xl font-extrabold text-slate-800 dark:text-slate-100">${percent}%</div>
                                <div class="text-[10px] sm:text-xs text-slate-500 font-semibold uppercase tracking-wider mt-1">Түсіну деңгейі</div>
                            </div>
                        </div>

                        <div class="flex flex-col sm:flex-row justify-center gap-2.5 sm:gap-3">
                            <button onclick="startQuiz(${currentState.currentVariantIndex}, ${currentState.isExpress})" class="w-full sm:w-auto justify-center px-5 py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold transition-all shadow-md flex items-center gap-2 text-sm">
                                <i class="fa-solid fa-rotate-right"></i> Қайта өту
                            </button>
                            <button onclick="goHome()" class="w-full sm:w-auto justify-center px-5 py-3 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-bold transition-all text-sm">
                                Басты бетке қайту
                            </button>
                        </div>
                    </div>

                    <div class="mb-8">
                        <h3 class="text-base sm:text-lg font-bold mb-3 sm:mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-triangle-exclamation text-rose-500"></i> Қатемен жұмыс (${wrongAnswers.length})
                        </h3>

                        ${wrongAnswers.length === 0 ? `
                            <div class="bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/50 p-5 rounded-xl sm:rounded-2xl text-center text-emerald-800 dark:text-emerald-300 font-medium text-xs sm:text-sm">
                                <i class="fa-solid fa-circle-check text-xl mb-1 block text-emerald-500"></i>
                                Тамаша! Барлық сұраққа дұрыс жауап бердіңіз!
                            </div>
                        ` : `
                            <div class="space-y-3 sm:space-y-4">
                                ${wrongAnswers.map((item, idx) => {
                                    const q = item.question;
                                    const userChoice = q.choices[item.answer.choiceIndex];
                                    const correctChoice = q.choices.find(c => c.isCorrect);

                                    return `
                                        <div class="bg-white dark:bg-slate-900 rounded-xl sm:rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-slate-800 shadow-sm">
                                            <p class="font-bold text-xs sm:text-sm text-slate-900 dark:text-slate-100 mb-2 sm:mb-3">${idx + 1}. ${q.questionText}</p>
                                            
                                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs mb-3">
                                                <div class="p-2 sm:p-2.5 rounded-lg sm:rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-900 dark:text-rose-300 border border-rose-200 dark:border-rose-800/40">
                                                    <span class="font-bold block text-[10px] uppercase opacity-75">Сіздің жауабыңыз:</span>
                                                    ${userChoice ? userChoice.text : 'Белгіленбеді'}
                                                </div>
                                                <div class="p-2 sm:p-2.5 rounded-lg sm:rounded-xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/40">
                                                    <span class="font-bold block text-[10px] uppercase opacity-75">Дұрыс жауап:</span>
                                                    ${correctChoice.text}
                                                </div>
                                            </div>

                                            <div class="text-[11px] sm:text-xs text-slate-600 dark:text-slate-400 bg-slate-50 dark:bg-slate-800/50 p-2.5 sm:p-3 rounded-lg sm:rounded-xl">
                                                <strong class="font-semibold text-slate-800 dark:text-slate-200">Дерек:</strong> ${q.explanation}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function toggleSearchModal() {
            const modal = document.getElementById('search-modal');
            if (modal) {
                modal.classList.toggle('hidden');
                if (!modal.classList.contains('hidden')) {
                    document.getElementById('search-input').focus();
                }
            }
        }

        function searchQuestions(query) {
            const resultsContainer = document.getElementById('search-results');
            if (!resultsContainer) return;

            if (!query.trim()) {
                resultsContainer.innerHTML = `<p class="text-center text-slate-400 text-xs sm:text-sm py-8">Кілт сөзді енгізіңіз (мысалы: "Ботай", "Есім", "Аңырақай", "1991")</p>`;
                return;
            }

            const term = query.toLowerCase();
            const allQ = ALL_VARIANTS.map(v => v.questions).flat();
            const matches = allQ.filter(q => q[0].toLowerCase().includes(term) || q[3].toLowerCase().includes(term));

            if (matches.length === 0) {
                resultsContainer.innerHTML = `<p class="text-center text-slate-400 text-xs sm:text-sm py-8">Сұрақ табылған жоқ</p>`;
                return;
            }

            resultsContainer.innerHTML = matches.map(q => `
                <div class="p-3 bg-slate-50 dark:bg-slate-800/60 rounded-xl border border-slate-200 dark:border-slate-700/60">
                    <p class="font-bold text-xs sm:text-sm text-slate-900 dark:text-slate-100 mb-1">${q[0]}</p>
                    <p class="text-xs text-emerald-600 dark:text-emerald-400 font-semibold mb-1">Дұрыс жауап: ${q[1][q[2]]}</p>
                    <p class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400">${q[3]}</p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
